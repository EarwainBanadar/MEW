[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mew"
version = "0.9.3"
description = "Model Engineering Workbench for deterministic BPMN engineering"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "MES/MOM Solution Template Management"}]
keywords = ["BPMN", "MES", "MOM", "model engineering", "validation"]
dependencies = [
  "lxml>=5",
  "tomli>=2; python_version < '3.11'"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "build>=1.2",
  "ruff>=0.6"
]

[project.scripts]
mew-semantic = "mew_semantic.cli:main"
mew-bpmn = "mew_bpmn.cli:main"
mew-rules = "mew_rules.standard_cli:main"
mew-report = "mew_reporting.cli:main"
mew-release = "mew_release.cli:main"
mew-quality = "mew_quality:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
relative_files = true
source = ["src"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["releases", "examples"]

[tool.ruff.lint]
# Incremental v0.10.0 quality gate: runtime defects, unused imports,
# deterministic import sorting and selected Python 3.10 type-hint modernization.
select = ["E9", "F401", "F63", "F7", "F82", "I", "UP006", "UP035", "UP045"]
