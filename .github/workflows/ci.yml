name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --quiet --upgrade pip
      - run: python -m pip install --quiet -e ".[dev]"
      - name: Generate Ruff diagnostics
        shell: bash
        run: |
          set +e
          python -m ruff check src tests --output-format=concise | tee ruff-diagnostics.txt
          status=${PIPESTATUS[0]}
          echo "$status" > ruff-exit-code.txt
          exit 0
      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-e7-diagnostics
          path: |
            ruff-diagnostics.txt
            ruff-exit-code.txt
          if-no-files-found: error
          retention-days: 3
      - name: Enforce Ruff result
        shell: bash
        run: exit "$(cat ruff-exit-code.txt)"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --quiet --upgrade pip
      - run: python -m pip install --quiet -e ".[dev]"
      - run: python -m pytest

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --quiet --upgrade pip
      - run: python -m pip install --quiet -e ".[dev]"
      - name: Generate coverage reports
        run: >-
          python -m pytest
          --cov=src
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
          retention-days: 14
