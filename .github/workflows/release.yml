name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Validate tag, project version and changelog
        run: python scripts/validate_release.py --tag "${GITHUB_REF_NAME}"
      - name: Lint
        run: python -m ruff check src tests scripts --output-format=concise
      - name: Test
        run: python -m pytest
      - name: Build Python distributions
        run: python -m build
      - name: Smoke-test wheel in clean environment
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install --upgrade pip
          wheel-smoke/bin/python -m pip install dist/*.whl
          wheel-smoke/bin/python -c "import mew_semantic, mew_bpmn, mew_rules, mew_reporting, mew_release"
          wheel-smoke/bin/mew-semantic --help
      - name: Smoke-test source distribution in clean environment
        run: |
          python -m venv sdist-smoke
          sdist-smoke/bin/python -m pip install --upgrade pip
          sdist-smoke/bin/python -m pip install dist/*.tar.gz
          sdist-smoke/bin/python -c "import mew_semantic, mew_bpmn, mew_rules, mew_reporting, mew_release"
      - name: Build deterministic MEW source release
        run: python scripts/create_source_release.py
      - name: Validate source release manifest and checksum
        run: python scripts/validate_release.py --tag "${GITHUB_REF_NAME}" --manifest releases/MEW_${GITHUB_REF_NAME}_manifest.json
      - name: Publish verified release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            releases/MEW_${{ github.ref_name }}_source.zip
            releases/MEW_${{ github.ref_name }}_manifest.json
